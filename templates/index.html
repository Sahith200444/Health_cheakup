<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <title>AI Health Assistant</title>
  
  <link rel="stylesheet" href="/static/style.css">
</head>
<!-- Loader -->
<!-- LOADER -->
<div id="loader">
  <div class="loader-box">
    <div class="spinner"></div>
    <div class="med-icon">⚕</div>
    <div class="progress" id="progress">0%</div>
    <p>Analyzing your health<span class="dots"></span></p>
  </div>
</div>


<body>

<div class="bg-glow"></div>

<div class="container glass">

  <div class="header">
    <h1>🤖 AI Health Assistant</h1>
    <p>Your Smart Medical Companion</p>
    <div style="display:flex;justify-content:space-between;">
  <p>Welcome {{username}}</p>

  <div>
    <a href="/history" title="History">📜 History</a> |
    <a href="/logout">Logout</a>
  </div>
</div>


  </div>

  <form action="/predict" method="POST" class="form-grid">

    <div>
      <label>Name</label>
      <input type="text" value="{{username}}" name="name" required>
    </div>

    <div>
      <label>Age</label>
      <input type="number" name="age" required>
    </div>

    <div>
      <label>Gender</label>
      <select name="gender">
        <option>Male</option>
        <option>Female</option>
      </select>
    </div>

    <div>
      <label>Height (cm)</label>
      <input type="number" name="height" required>
    </div>

    <div>
      <label>Weight (kg)</label>
      <input type="number" name="weight" required>
    </div>

    <div class="full">
      <label>Describe Symptoms</label>
      <textarea name="symptoms" rows="4" required></textarea>
    </div>

    <input type="hidden" name="latitude" id="lat">
    <input type="hidden" name="longitude" id="lon">

    <div class="full">
      <button type="submit">Analyze My Health</button>
    </div>

  </form>

</div>

<script src="/static/script.js"></script>
<script>
navigator.geolocation.getCurrentPosition(function(pos){
  document.getElementById("lat").value = pos.coords.latitude;
  document.getElementById("lon").value = pos.coords.longitude;
});
</script>

</body>
</html>
