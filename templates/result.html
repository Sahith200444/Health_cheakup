<!DOCTYPE html>
<html>
<head>
  <title>Prediction Result</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h2>Hi {{name}}, here’s your report:</h2>

  <div class="card">
    <h3>🩺 Predicted Disease</h3>
    <p>{{disease}}</p>
  </div>

  <div class="card">
    <h3>🥗 Suggested Diet</h3>
    <p>{{diet}}</p>
  </div>

  <div class="card">
    <h3>👨‍⚕️ Recommended Doctor</h3>
    <p>{{doctor}}</p>
  </div>

  <a href="/">Check another</a>
</div>
</body>
</html>
